<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>متتبع المهام الأسبوعي</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1d8;--ac:#0f766e;--neg:#b42318}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161715;--card:#202220;--tx:#eeeee8;--mu:#a3a29a;--bd:#33352f;--ac:#2dd4bf;--neg:#f97066}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161715;--card:#202220;--tx:#eeeee8;--mu:#a3a29a;--bd:#33352f;--ac:#2dd4bf;--neg:#f97066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,"Segoe UI",Tahoma,sans-serif;max-width:640px;margin-inline:auto;padding:12px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
nav button,.b{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.c h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-size:16px}
.r{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--bd)}
.r span{flex:1}.r small,.mu{color:var(--mu);font-size:12px}
input,select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;max-width:100%}
input[type=number]{width:70px}input[type=checkbox]{width:22px;height:22px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
.neg{color:var(--neg)}svg{direction:ltr;display:block}
.sc{font-weight:700}
</style></head><body>
<nav id="nav"></nav><main id="m"></main>
<script>
const K='tracker_v1',COL=['#0f766e','#7c3aed','#d97706','#2563eb','#dc2626'],DN=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
let S,tab='today',day,ed=false;
const I=(n,t,w,u)=>({id:Math.random().toString(36).slice(2,8),n,t,w,u});
function defaults(){return{cats:[
{id:'med',n:'طب',items:[I('مذاكرة (صفحات)','n',1,'ص'),I('محاضرات','n',2,'محاضرة')]},
{id:'faith',n:'تزكية',items:[I('فرض بالمسجد جماعة','n',3,'فرض'),I('فرض في البيت','n',1,'فرض'),I('سنن','n',0.5,'سنة'),I('قيام الليل','n',0.1,'دقيقة'),I('صيام','c',5,''),I('صدقة','m',0.01,'ج'),I('تلاوة قرآن','n',1,'ص'),I('مراجعة قرآن','n',1.5,'ص'),Object.assign(I('ذنوب','n',-3,'ذنب'),{pen:10}),I('أخطاء القرآن','n',-0.1,'خطأ'),I('طلب علم','n',1,'ص')]},
{id:'study',n:'دراسة',items:[I('كتب (صفحات)','n',1,'ص'),I('محاضرات','n',2,'محاضرة')]},
{id:'money',n:'فلوس',items:[I('ممارسة تداول','n',0.1,'دقيقة'),I('الالتزام بالخطة','c',3,'')]},
{id:'gym',n:'جيم',items:[I('تمرينة اليوم','c',5,''),I('مدة التمرين','n',0.1,'دقيقة')]}],log:{},goals:{},checked:{}}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=defaults();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const p2=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=s=>new Date(s+'T12:00:00'),add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fmt(d)};
const wk=s=>add(s,-((pd(s).getDay()+1)%7)),today=fmt(new Date());day=today;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=x=>Math.round(x*10)/10;
const val=(d,id)=>(S.log[d]&&S.log[d][id])||0;
const is=(d,i)=>{const l=S.log[d];if(i.pen&&d<=today&&d>=S.start&&!(l&&i.id in l))return-i.pen;const v=val(d,i.id);return i.t=='m'?v*i.w*(l&&l[i.id+'_s']?2:1):v*i.w};
const ds=(c,d)=>c.items.reduce((a,i)=>a+is(d,i),0);
const wdays=w=>[...Array(7)].map((_,i)=>add(w,i));
const wsum=(c,w)=>wdays(w).reduce((a,d)=>a+ds(c,d),0);
function line(v,lab,col){const W=320,H=130,p=22,mn=Math.min(0,...v),mx=Math.max(1,...v),x=i=>p+i*(W-2*p)/Math.max(1,v.length-1),y=a=>H-p-(a-mn)/(mx-mn)*(H-2*p);
return`<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${p}" x2="${W-p}" y1="${y(0)}" y2="${y(0)}" stroke="var(--bd)"/><polyline points="${v.map((a,i)=>x(i)+','+y(a)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5"/>${v.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a)}" r="3.5" fill="${col}"/><text x="${x(i)}" y="${H-6}" font-size="9" text-anchor="middle" fill="var(--mu)">${lab[i]}</text>`).join('')}<text x="2" y="10" font-size="9" fill="var(--mu)">${r1(mx)}</text></svg>`}
const T={today:'اليوم',week:'الأسبوع',long:'الأسابيع',goals:'الأهداف'};
function render(){nav.innerHTML=Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${T[k]}</button>`).join('');m.innerHTML=V[tab]()}
const V={
today(){const w=wk(day);let tot=0;const h=S.cats.map((c,ci)=>{const s=ds(c,day);tot+=s;
return`<div class="c"><h3><span style="color:${COL[ci%5]}">${esc(c.n)}</span><span class="sc ${s<0?'neg':''}">${r1(s)}</span></h3>${c.items.map(i=>row(c,i)).join('')}${ed?addRow(c):''}</div>`}).join('');
return`<div class="c" style="display:flex;gap:8px;align-items:center;justify-content:space-between"><div><input type="date" value="${day}" onchange="day=this.value||today;render()"> <small class="mu">${DN[pd(day).getDay()]}</small></div><div>المجموع: <span class="sc ${tot<0?'neg':''}">${r1(tot)}</span> <button class="b" onclick="ed=!ed;render()">${ed?'تم':'✎ تعديل'}</button></div></div>${h}`},
week(){const w=wk(day),ds7=wdays(w),lab=ds7.map(d=>DN[pd(d).getDay()]);const all=ds7.map(d=>S.cats.reduce((a,c)=>a+ds(c,d),0));
return`<div class="c"><input type="date" value="${day}" onchange="day=this.value||today;render()"> <small class="mu">أسبوع يبدأ ${w}</small></div><div class="c"><h3>الكل <span class="sc">${r1(all.reduce((a,b)=>a+b,0))}</span></h3>${line(all,lab,'var(--tx)')}</div>`+S.cats.map((c,ci)=>{const v=ds7.map(d=>ds(c,d));return`<div class="c"><h3><span style="color:${COL[ci%5]}">${esc(c.n)}</span><span class="sc">${r1(v.reduce((a,b)=>a+b,0))}</span></h3>${line(v,lab,COL[ci%5])}<details><summary class="mu">تفصيل العناصر</summary>${c.items.map(i=>`<div class="r"><span>${esc(i.n)}</span><small>${r1(ds7.reduce((a,d)=>a+val(d,i.id),0))} ${esc(i.u||'')}</small><b>${r1(ds7.reduce((a,d)=>a+is(d,i),0))}</b></div>`).join('')}</details></div>`}).join('')},
long(){const ks=Object.keys(S.log).sort(),cur=wk(today);let st=ks.length?wk(ks[0]):cur;const ws=[];while(st<=cur&&ws.length<60){ws.push(st);st=add(st,7)}const W=ws.slice(-16),lab=W.map(d=>d.slice(5));
const tot=W.map(w=>S.cats.reduce((a,c)=>a+wsum(c,w),0));
return`<div class="c"><h3>إجمالي الأسبوع (آخر ${W.length})</h3>${line(tot,lab,'var(--tx)')}</div>`+S.cats.map((c,ci)=>`<div class="c"><h3 style="color:${COL[ci%5]}">${esc(c.n)}</h3>${line(W.map(w=>wsum(c,w)),lab,COL[ci%5])}</div>`).join('')},
goals(){const w=wk(day),pw=add(w,-7),g=(S.goals[w]=S.goals[w]||{}),pg=S.goals[pw]||{};
const prev=S.cats.map(c=>{const x=pg[c.id];if(!x||!x.target)return'';const it=c.items.find(i=>i.id==x.item);if(!it)return'';const v=wdays(pw).reduce((a,d)=>a+val(d,it.id),0),ok=v>=x.target;return`<div class="r"><span>${esc(c.n)}: ${esc(x.note||it.n)}</span><b class="${ok?'':'neg'}">${r1(v)}/${x.target} ${ok?'✓':'✗'}</b></div>`}).join('');
return`<div class="c"><input type="date" value="${day}" onchange="day=this.value||today;render()"> <small class="mu">أهداف أسبوع ${w}</small></div>`+(prev?`<div class="c"><h3>نتيجة الأسبوع الماضي</h3>${prev}</div>`:'')+S.cats.map((c,ci)=>{const x=g[c.id]||{item:c.items[0]&&c.items[0].id,target:0,note:''},it=c.items.find(i=>i.id==x.item),v=it?wdays(w).reduce((a,d)=>a+val(d,it.id),0):0,pc=x.target?Math.min(100,Math.max(0,v/x.target*100)):0;
return`<div class="c"><h3 style="color:${COL[ci%5]}">${esc(c.n)}</h3><div class="r" style="border:0"><select onchange="setG('${c.id}','item',this.value)">${c.items.map(i=>`<option value="${i.id}" ${i.id==x.item?'selected':''}>${esc(i.n)}</option>`).join('')}</select><input type="number" min="0" step="any" value="${x.target||''}" placeholder="الهدف" onchange="setG('${c.id}','target',+this.value)"></div><input style="width:100%" value="${esc(x.note||'')}" placeholder="وصف الهدف (اختياري)" onchange="setG('${c.id}','note',this.value)"><div class="bar"><i style="width:${pc}%;background:${COL[ci%5]}"></i></div><small class="mu">${r1(v)} / ${x.target||0}</small></div>`}).join('')},
set(){return S.cats.map((c,ci)=>`<div class="c"><h3 style="color:${COL[ci%5]}">${esc(c.n)}</h3>${c.items.map(i=>`<div class="r"><span>${esc(i.n)}</span><input type="number" step="any" value="${i.w}" onchange="setI('${c.id}','${i.id}',+this.value)"><button class="b" onclick="delI('${c.id}','${i.id}')">حذف</button></div>`).join('')}<div class="r"><input id="n${c.id}" placeholder="عنصر جديد" style="flex:1"><select id="t${c.id}"><option value="n">عدد</option><option value="c">تم/لم يتم</option></select><input type="number" id="w${c.id}" step="any" placeholder="وزن"><button class="b" onclick="addI('${c.id}')">+</button></div></div>`).join('')+`<div class="c"><small class="mu">الوزن = عدد النقاط لكل وحدة. الوزن السالب (مثل الذنوب) يخصم من السكور. البيانات محفوظة في متصفحك فقط.</small></div>`}};
function setV(id,v){const l=S.log[day]=S.log[day]||{};if(v==='')delete l[id];else l[id]=+v;save();render()}
function setG(c,f,v){const w=wk(day);S.goals[w]=S.goals[w]||{};const x=S.goals[w][c]=S.goals[w][c]||{item:S.cats.find(a=>a.id==c).items[0].id,target:0,note:''};x[f]=v;save();render()}
function setI(c,id,f,v){const it=S.cats.find(a=>a.id==c).items.find(i=>i.id==id);if(f=='pen'&&!v)delete it.pen;else it[f]=v;save();render()}
function row(c,i){const l=S.log[day]||{},has=i.id in l;
if(ed)return`<div class="r" style="flex-wrap:wrap"><input value="${esc(i.n)}" style="flex:1;min-width:110px" onchange="setI('${c.id}','${i.id}','n',this.value)"><label class="mu">وزن <input type="number" step="any" value="${i.w}" onchange="setI('${c.id}','${i.id}','w',+this.value)"></label><label class="mu">عقوبة <input type="number" min="0" step="any" value="${i.pen||''}" placeholder="0" onchange="setI('${c.id}','${i.id}','pen',+this.value)"></label><button class="b" onclick="delI('${c.id}','${i.id}')">حذف</button></div>`;
const sc=is(day,i);let inp;
if(i.t=='c')inp=`<input type="checkbox" ${val(day,i.id)?'checked':''} onchange="setV('${i.id}',this.checked?1:0)">`;
else{inp=`<input type="number" min="0" step="any" value="${has?val(day,i.id):''}" placeholder="0" onchange="setV('${i.id}',this.value)"><small>${esc(i.u||'')}</small>`;
if(i.t=='m')inp+=`<select onchange="setV('${i.id}_s',+this.value)"><option value="0">علن ×1</option><option value="1" ${l[i.id+'_s']?'selected':''}>سر ×2</option></select>`}
return`<div class="r"><span>${esc(i.n)} <small>×${i.w}${i.pen?' · عقوبة '+i.pen:''}</small></span>${inp}<b class="${sc<0?'neg':''}" style="min-width:42px;text-align:end">${r1(sc)}</b></div>`}
function addRow(c){return`<div class="r" style="flex-wrap:wrap"><input id="n${c.id}" placeholder="مهمة فرعية جديدة" style="flex:1;min-width:110px"><select id="t${c.id}"><option value="n">عدد</option><option value="c">تم/لم يتم</option><option value="m">مبلغ + سر/علن</option></select><input type="number" id="w${c.id}" step="any" placeholder="وزن"><button class="b" onclick="addI('${c.id}')">+</button></div>`}
function delI(c,id){const k=S.cats.find(a=>a.id==c);k.items=k.items.filter(i=>i.id!=id);save();render()}
function addI(c){const n=document.getElementById('n'+c).value.trim();if(!n)return;S.cats.find(a=>a.id==c).items.push(I(n,document.getElementById('t'+c).value,+document.getElementById('w'+c).value||1,''));save();render()}
(function(){if(!S.start){const k=Object.keys(S.log).sort();S.start=k[0]||today}
const f=S.cats.find(c=>c.id=='faith');if(f){f.items.forEach(i=>{if(i.n=='صدقة'&&i.t=='c'){i.t='m';i.w=0.01;i.u='ج'}if(i.n=='ذنوب'&&!i.pen)i.pen=10});if(!f.items.some(i=>i.n=='أخطاء القرآن'))f.items.push(I('أخطاء القرآن','n',-0.1,'خطأ'))}save()})();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
